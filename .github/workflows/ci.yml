name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3"]
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint
        run: find src tests conformance examples -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit

  broker:
    name: Conformance, integration and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check out FireMQ
        uses: actions/checkout@v5
        with:
          repository: FireMQ/firemq
          # Pinned to the commit with the SDK conformance suite. The ref moves to main once
          # FireMQ/firemq#38 merges.
          ref: b90a2ff9bda15a398c6957bfb291e4a9db9957ab
          path: firemq

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firemq

      - name: Build the broker and the conformance runner
        working-directory: firemq
        run: cargo build -p firemq -p firemq-conformance

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Conformance suite
        run: firemq/target/debug/firemq-conformance run --driver "php conformance/driver.php"

      - name: Start the broker
        run: |
          firemq/target/debug/firemq --ephemeral --amqps off --fires off > broker.log 2>&1 &
          for _ in $(seq 1 100); do
            if (echo > /dev/tcp/127.0.0.1/5673) 2>/dev/null; then exit 0; fi
            sleep 0.1
          done
          cat broker.log
          exit 1

      - name: Integration tests
        env:
          FIREMQ_URL: fire://guest:guest@127.0.0.1:5673
        run: vendor/bin/phpunit --testsuite integration

      - name: Examples
        env:
          FIREMQ_URL: fire://guest:guest@127.0.0.1:5673
        run: |
          for example in examples/*.php; do
            echo "::group::$example"
            timeout 30 php "$example"
            echo "::endgroup::"
          done

      - name: Broker log
        if: failure()
        run: cat broker.log || true
